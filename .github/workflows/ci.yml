name: Full Windows gate for boundary repair

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Fixed Windows gate only
        type: choice
        default: windows-native
        options: [windows-native, mac-focused, windows-startup-probe, windows-payload-gate, windows-startup-delayed, windows-registry-probe, windows-argv-gate, windows-startup-sequence, windows-startup-failures, windows-startup-shell-boundary, windows-startup-attestation, windows-startup-reuse-boundary, windows-startup-skipped-cleanup, windows-startup-cleanup-gate, windows-startup-context-trace, windows-startup-marker-context, windows-startup-composer-gate, windows-startup-profile-boundary, mac-argv-gate, mac-cleanup-gate, mac-composer-gate]
      comparison_base:
        description: Retained dispatch interface; source is pinned below
        type: string
        required: false

permissions:
  contents: read

jobs:
  windows-fixed-source:
    if: inputs.environment == 'windows-native' || startsWith(inputs.environment, 'windows-startup-') || inputs.environment == 'windows-payload-gate' || inputs.environment == 'windows-registry-probe' || inputs.environment == 'windows-argv-gate'
    env:
      PRODUCT_SOURCE: f99596a82ea5c1f3425bc753f22d29f34aef5a78
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout adopted product source, independent of workflow branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: f99596a82ea5c1f3425bc753f22d29f34aef5a78
          fetch-depth: 1
          persist-credentials: false
      - name: Verify fixed source and clean checkout
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          if ($head -ne $env:PRODUCT_SOURCE) { throw 'Unexpected product source' }
          if (git status --porcelain) { throw 'Product checkout is not clean' }
          Write-Output "product_source=$head"
          Write-Output "workflow_source=${{ github.sha }}"
          Write-Output "runner_image=$env:ImageOS/$env:ImageVersion"
      - name: Checkout diagnostic script
        if: startsWith(inputs.environment, 'windows-startup-') || inputs.environment == 'windows-registry-probe'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: diagnostic-harness
          persist-credentials: false
      - name: Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Install exact psmux 3.3.8 in checkout-local tools
        shell: pwsh
        run: |
          $tools = Join-Path $env:GITHUB_WORKSPACE '.ci-tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $zip = Join-Path $tools 'psmux-v3.3.8-windows-x64.zip'
          Invoke-WebRequest 'https://github.com/psmux/psmux/releases/download/v3.3.8/psmux-v3.3.8-windows-x64.zip' -OutFile $zip
          $digest = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '1ad127ba937194a890b933a73d9b023e297bd73dc742abd841bf159984c2effe') { throw 'psmux archive hash mismatch' }
          Expand-Archive $zip -DestinationPath (Join-Path $tools 'psmux')
          $bins = @(Get-ChildItem (Join-Path $tools 'psmux') -Recurse -Filter psmux.exe)
          if ($bins.Count -ne 1) { throw 'Expected one psmux binary' }
          $bins[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Output "psmux_archive_sha256=$digest"
      - name: Install fixture-required ripgrep in checkout-local tools
        shell: pwsh
        run: |
          $tools = Join-Path $env:GITHUB_WORKSPACE '.ci-tools'
          $zip = Join-Path $tools 'ripgrep.zip'
          Invoke-WebRequest 'https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-pc-windows-msvc.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd0f534024c42afd6cb4d38907c25cd2b249b79bbe6cc1dbee8e3e37c2b6e25a1') { throw 'ripgrep archive hash mismatch' }
          Expand-Archive $zip -DestinationPath (Join-Path $tools 'ripgrep')
          $bins = @(Get-ChildItem (Join-Path $tools 'ripgrep') -Recurse -Filter rg.exe)
          if ($bins.Count -ne 1) { throw 'Expected one ripgrep binary' }
          $bins[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install fixed lock dependencies
        shell: pwsh
        run: |
          node --version
          npm --version
          npm run ci:dependencies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Product preflight and full gate for repaired source
        shell: pwsh
        run: |
          [Console]::InputEncoding = [Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Text.UTF8Encoding]::new($false)
          chcp 65001
          psmux -V
          rg --version
          foreach ($key in @('core.hooksPath', 'init.templateDir')) {
            git config --system --get $key | Out-Null
            if ($LASTEXITCODE -eq 0) { Write-Output "git system ${key}: set" }
            elseif ($LASTEXITCODE -eq 1) { Write-Output "git system ${key}: unset" }
            else { throw 'Unknown system git configuration' }
          }
          if ('${{ inputs.environment }}' -eq 'windows-startup-sequence') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --import ./diagnostic-harness/scripts/windows-startup-trace.mjs --test --test-name-pattern='^(配送記録の保存に失敗した初手とfollow-up|readAgentTranscript: Claudeはprivate transcript)' test/core-agent-observe.test.mjs
            $testCode = $LASTEXITCODE
            Get-ChildItem -Filter 'startup-trace-*.jsonl' | ForEach-Object { Get-Content $_.FullName }
            exit $testCode
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-failures') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --import ./diagnostic-harness/scripts/windows-startup-trace.mjs --test --test-name-pattern='^(openAgent codex agent_done: model と effort|target contract: (Claudeは通常3 scope|nested launcher)|readAgentTranscript: Claudeはprivate transcript)' test/core-agent-observe.test.mjs test/core-agent.test.mjs
            $testCode = $LASTEXITCODE
            Get-ChildItem -Filter 'startup-trace-*.jsonl' | ForEach-Object { Get-Content $_.FullName }
            exit $testCode
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-shell-boundary') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-shell-boundary-probe.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-attestation') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-backend-attestation.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-reuse-boundary') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-shell-boundary-probe.mjs --reuse-only
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-skipped-cleanup') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-skipped-cleanup-probe.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-cleanup-gate') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/windows-native-cleanup-isolation.test.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-context-trace') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --import ./diagnostic-harness/scripts/windows-startup-trace.mjs --test test/core-agent-observe.test.mjs test/core-agent.test.mjs
            $testCode = $LASTEXITCODE
            Get-ChildItem -Filter 'startup-trace-*.jsonl' | ForEach-Object { Get-Content $_.FullName }
            Get-ChildItem -Filter 'fixture-invocations-*.log' | ForEach-Object { Write-Output ('INVOCATION_FILE=' + $_.Name); Get-Content $_.FullName }
            exit $testCode
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-marker-context') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --import ./diagnostic-harness/scripts/windows-startup-marker-trace.mjs --test test/core-agent-dispatch.test.mjs test/core-agent-initial-prompt.test.mjs test/core-agent-launch-state.test.mjs test/core-agent-observe.test.mjs test/core-agent.test.mjs
            $testCode = $LASTEXITCODE
            Get-ChildItem -Filter 'startup-trace-*.jsonl' | ForEach-Object { Get-Content $_.FullName }
            Get-ChildItem -Filter 'fixture-invocations-*.log' | ForEach-Object { Write-Output ('INVOCATION_FILE=' + $_.Name); Get-Content $_.FullName }
            exit $testCode
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-composer-gate') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test --test-name-pattern='^(agent composer |sendAgentMessage: .*Codex)' test/agent-composer-payload.test.mjs test/core-agent-initial-prompt.test.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-profile-boundary') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-shell-boundary-probe.mjs --profile-only
          } elseif ('${{ inputs.environment }}' -like 'windows-startup-*') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-agent-startup-probe.mjs '${{ inputs.environment }}'
          } elseif ('${{ inputs.environment }}' -eq 'windows-registry-probe') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node diagnostic-harness/scripts/windows-registry-query-probe.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-payload-gate') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test --test-name-pattern='Windows PowerShellの公開64KiB' test/tmux-runtime.test.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-argv-gate') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test --test-name-pattern='^(openAgent codex agent_done: (model |quoted top)|target contract: (Codexは通常CODEX_HOME|Claudeは通常3 scope)|readAgentTranscript: Claudeはprivate transcript)' test/core-agent-observe.test.mjs test/core-agent.test.mjs
          } else {
            $env:PRODUCT_CI_TEST_SCOPE = 'all'
            node scripts/run-product-ci-tests.mjs
          }
          exit $LASTEXITCODE

  mac-focused:
    if: inputs.environment == 'mac-focused' || inputs.environment == 'mac-argv-gate' || inputs.environment == 'mac-cleanup-gate' || inputs.environment == 'mac-composer-gate'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: f99596a82ea5c1f3425bc753f22d29f34aef5a78
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Prepare isolated hosted native fixture backend
        if: inputs.environment == 'mac-argv-gate' || inputs.environment == 'mac-cleanup-gate' || inputs.environment == 'mac-composer-gate'
        run: brew list tmux >/dev/null 2>&1 || brew install tmux
      - name: Verify source and fixed lock
        run: |
          test "$(git rev-parse HEAD)" = f99596a82ea5c1f3425bc753f22d29f34aef5a78
          test -z "$(git status --porcelain)"
          npm run ci:dependencies
      - name: Preflight and platform runtime gates
        run: |
          for key in core.hooksPath init.templateDir; do
            if git config --system --get "$key" >/dev/null; then
              echo "git system $key: set"
            else
              code=$?
              test "$code" = 1
              echo "git system $key: unset"
            fi
          done
          npm run build
          node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
          if [ '${{ inputs.environment }}' = mac-argv-gate ]; then
            node --import ./test/seat-env.mjs --test --test-name-pattern='^(openAgent codex agent_done: (model |quoted top)|target contract: (Codexは通常CODEX_HOME|Claudeは通常3 scope)|readAgentTranscript: Claudeはprivate transcript)' test/core-agent-observe.test.mjs test/core-agent.test.mjs
          elif [ '${{ inputs.environment }}' = mac-composer-gate ]; then
            node --import ./test/seat-env.mjs --test --test-name-pattern='^(agent composer |sendAgentMessage: .*Codex)' test/agent-composer-payload.test.mjs test/core-agent-initial-prompt.test.mjs
          elif [ '${{ inputs.environment }}' = mac-cleanup-gate ]; then
            node --import ./test/seat-env.mjs --test test/execution-launch-create-contention.test.mjs test/windows-native-cleanup-isolation.test.mjs
          else
            node --import ./test/seat-env.mjs --test test/tmux-runtime.test.mjs test/repository-contract.test.mjs
          fi
