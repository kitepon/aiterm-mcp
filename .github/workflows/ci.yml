name: Hosted fixed-source product gates

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Fixed Windows gate only
        type: choice
        default: windows-native
        options: [windows-native, mac-focused, windows-startup-probe, windows-payload-gate, windows-startup-delayed, windows-registry-probe, windows-argv-gate, windows-startup-sequence, windows-startup-failures, windows-startup-shell-boundary, windows-startup-attestation, windows-startup-reuse-boundary, windows-startup-skipped-cleanup, windows-startup-cleanup-gate, windows-startup-context-trace, windows-startup-marker-context, windows-startup-capture-missing, windows-startup-composer-gate, windows-observation-gate, windows-portable-gate, windows-launch-gate, windows-shell-gate, windows-startup-profile-boundary, windows-startup-pre-bash-boundary, windows-startup-native-init-boundary, windows-startup-transport-probe, windows-startup-native-writer-trace, windows-startup-direct-native-init, windows-startup-direct-default-init, windows-startup-input-init-overlap, windows-startup-console-miss, windows-startup-stack-miss, windows-startup-stdin-probe, mac-argv-gate, mac-cleanup-gate, mac-composer-gate, mac-observation-gate, mac-portable-gate, mac-launch-gate, mac-shell-gate, windows-participant-gate, mac-participant-gate, windows-readiness-gate, mac-readiness-gate]
      comparison_base:
        description: Retained dispatch interface; source is pinned below
        type: string
        required: false

permissions:
  contents: read

jobs:
  windows-fixed-source:
    if: inputs.environment == 'windows-native' || startsWith(inputs.environment, 'windows-startup-') || inputs.environment == 'windows-payload-gate' || inputs.environment == 'windows-registry-probe' || inputs.environment == 'windows-argv-gate' || inputs.environment == 'windows-observation-gate' || inputs.environment == 'windows-portable-gate' || inputs.environment == 'windows-launch-gate' || inputs.environment == 'windows-shell-gate' || inputs.environment == 'windows-participant-gate' || inputs.environment == 'windows-readiness-gate'
    env:
      PRODUCT_SOURCE: ca2dffee40159ab94c27778daa7a97316bb60de6
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout adopted product source, independent of workflow branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ca2dffee40159ab94c27778daa7a97316bb60de6
          fetch-depth: 1
          persist-credentials: false
      - name: Verify fixed source and clean checkout
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          if ($head -ne $env:PRODUCT_SOURCE) { throw 'Unexpected product source' }
          if (git status --porcelain) { throw 'Product checkout is not clean' }
          Write-Output "product_source=$head"
          Write-Output "workflow_source=${{ github.sha }}"
          Write-Output "runner_image=$env:ImageOS/$env:ImageVersion"
      - name: Checkout diagnostic script
        if: startsWith(inputs.environment, 'windows-startup-') || inputs.environment == 'windows-registry-probe'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: diagnostic-harness
          persist-credentials: false
      - name: Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Install exact psmux 3.3.8 in checkout-local tools
        shell: pwsh
        run: |
          $tools = Join-Path $env:GITHUB_WORKSPACE '.ci-tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $zip = Join-Path $tools 'psmux-v3.3.8-windows-x64.zip'
          Invoke-WebRequest 'https://github.com/psmux/psmux/releases/download/v3.3.8/psmux-v3.3.8-windows-x64.zip' -OutFile $zip
          $digest = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '1ad127ba937194a890b933a73d9b023e297bd73dc742abd841bf159984c2effe') { throw 'psmux archive hash mismatch' }
          Expand-Archive $zip -DestinationPath (Join-Path $tools 'psmux')
          $bins = @(Get-ChildItem (Join-Path $tools 'psmux') -Recurse -Filter psmux.exe)
          if ($bins.Count -ne 1) { throw 'Expected one psmux binary' }
          $bins[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Output "psmux_archive_sha256=$digest"
      - name: Install fixture-required ripgrep in checkout-local tools
        shell: pwsh
        run: |
          $tools = Join-Path $env:GITHUB_WORKSPACE '.ci-tools'
          $zip = Join-Path $tools 'ripgrep.zip'
          Invoke-WebRequest 'https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-pc-windows-msvc.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd0f534024c42afd6cb4d38907c25cd2b249b79bbe6cc1dbee8e3e37c2b6e25a1') { throw 'ripgrep archive hash mismatch' }
          Expand-Archive $zip -DestinationPath (Join-Path $tools 'ripgrep')
          $bins = @(Get-ChildItem (Join-Path $tools 'ripgrep') -Recurse -Filter rg.exe)
          if ($bins.Count -ne 1) { throw 'Expected one ripgrep binary' }
          $bins[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install fixed lock dependencies
        shell: pwsh
        run: |
          node --version
          npm --version
          npm run ci:dependencies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checkout exact backend source for write-result diagnosis
        if: inputs.environment == 'windows-startup-native-writer-trace' || inputs.environment == 'windows-startup-direct-native-init' || inputs.environment == 'windows-startup-direct-default-init' || inputs.environment == 'windows-startup-input-init-overlap'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: psmux/psmux
          ref: 66cf61354c473b35d4f0c06c57384fc46d61ffdb
          path: native-writer-source
          persist-credentials: false
      - name: Build diagnostic backend with scalar write results
        if: inputs.environment == 'windows-startup-native-writer-trace' || inputs.environment == 'windows-startup-direct-native-init' || inputs.environment == 'windows-startup-direct-default-init' || inputs.environment == 'windows-startup-input-init-overlap'
        shell: pwsh
        run: |
          if ('${{ inputs.environment }}' -in @('windows-startup-direct-native-init', 'windows-startup-direct-default-init', 'windows-startup-input-init-overlap')) {
            node diagnostic-harness/scripts/prepare-native-writer-probe.mjs --direct-init
          } else {
            node diagnostic-harness/scripts/prepare-native-writer-probe.mjs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CARGO_HOME = Join-Path $env:GITHUB_WORKSPACE '.ci-tools/cargo-cache'
          rustc --version
          cargo --version
          cargo build --locked --release --bin psmux --manifest-path native-writer-source/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $native = Join-Path $env:GITHUB_WORKSPACE 'native-writer-source/target/release'
          Copy-Item (Join-Path $native 'psmux.exe') (Join-Path $native 'tmux.exe')
          $exe = Join-Path $native 'psmux.exe'
          Write-Output ('diagnostic_backend_sha256=' + (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant())
          Add-Content $env:GITHUB_ENV ('AITERM_PSMUX=' + $exe)
          Add-Content $env:GITHUB_PATH $native
      - name: Product preflight and full gate for repaired source
        shell: pwsh
        run: |
          [Console]::InputEncoding = [Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Text.UTF8Encoding]::new($false)
          chcp 65001
          psmux -V
          rg --version
          foreach ($key in @('core.hooksPath', 'init.templateDir')) {
            git config --system --get $key | Out-Null
            if ($LASTEXITCODE -eq 0) { Write-Output "git system ${key}: set" }
            elseif ($LASTEXITCODE -eq 1) { Write-Output "git system ${key}: unset" }
            else { throw 'Unknown system git configuration' }
          }
          if ('${{ inputs.environment }}' -in @('windows-startup-direct-native-init', 'windows-startup-direct-default-init', 'windows-startup-input-init-overlap')) {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ('${{ inputs.environment }}' -eq 'windows-startup-input-init-overlap') {
              node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-argv-transport-probe.mjs --overlap-only
            } elseif ('${{ inputs.environment }}' -eq 'windows-startup-direct-default-init') {
              node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-shell-boundary-probe.mjs --direct-native-default-only
            } else {
              node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-shell-boundary-probe.mjs --direct-native-only
            }
            $testCode = $LASTEXITCODE
            Get-ChildItem -Path 'native-writer-source/target/release' -Filter 'diagnostic-writer-*.jsonl' | ForEach-Object { Get-Content $_.FullName }
            exit $testCode
          } elseif ('${{ inputs.environment }}' -in @('windows-startup-console-miss', 'windows-startup-stack-miss')) {
            node diagnostic-harness/scripts/prepare-console-miss-observer.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $tokens = $null
            $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'diagnostic-harness/scripts/windows-console-input-observe.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw 'Console observer PowerShell parse failed' }
            Add-Type -Path '.ci-tools/console-input-type.cs'
            if ([Runtime.InteropServices.Marshal]::SizeOf([type][FixtureConsoleInputObservation+InputRecord]) -ne 20) { throw 'Console input record layout mismatch' }
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-stack-probe-preflight.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ('${{ inputs.environment }}' -eq 'windows-startup-stack-miss') {
              $env:PRODUCT_CI_TEST_SCOPE = 'selected'
              $env:PRODUCT_CI_TEST_FILES = '["test/agent-send-serial.test.mjs","test/core-agent-observe.test.mjs","test/core-agent.test.mjs"]'
            } else {
              $env:PRODUCT_CI_TEST_SCOPE = 'all'
            }
            node scripts/run-product-ci-tests.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-native-writer-trace') {
            $env:PRODUCT_CI_TEST_SCOPE = 'all'
            $preload = Join-Path $env:GITHUB_WORKSPACE 'diagnostic-harness/scripts/windows-native-writer-preload.mjs'
            $preloadUrl = node --input-type=module -e "import { pathToFileURL } from 'node:url'; process.stdout.write(pathToFileURL(process.argv[1]).href);" $preload
            $env:NODE_OPTIONS = '--import=' + $preloadUrl
            node scripts/run-product-ci-tests.mjs
            $testCode = $LASTEXITCODE
            Get-ChildItem -Path 'native-writer-source/target/release' -Filter 'diagnostic-writer-*.jsonl' | ForEach-Object { Get-Content $_.FullName }
            Get-ChildItem -Path 'diagnostic-harness/scripts/.diagnostic-workers' -Filter 'transport-worker-*.jsonl' -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
            exit $testCode
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-sequence') {

            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --import ./diagnostic-harness/scripts/windows-startup-trace.mjs --test --test-name-pattern='^(配送記録の保存に失敗した初手とfollow-up|readAgentTranscript: Claudeはprivate transcript)' test/core-agent-observe.test.mjs
            $testCode = $LASTEXITCODE
            Get-ChildItem -Filter 'startup-trace-*.jsonl' | ForEach-Object { Get-Content $_.FullName }
            exit $testCode
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-failures') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --import ./diagnostic-harness/scripts/windows-startup-trace.mjs --test --test-name-pattern='^(openAgent codex agent_done: model と effort|target contract: (Claudeは通常3 scope|nested launcher)|readAgentTranscript: Claudeはprivate transcript)' test/core-agent-observe.test.mjs test/core-agent.test.mjs
            $testCode = $LASTEXITCODE
            Get-ChildItem -Filter 'startup-trace-*.jsonl' | ForEach-Object { Get-Content $_.FullName }
            exit $testCode
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-shell-boundary') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-shell-boundary-probe.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-attestation') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-backend-attestation.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-reuse-boundary') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-shell-boundary-probe.mjs --reuse-only
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-skipped-cleanup') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-skipped-cleanup-probe.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-cleanup-gate') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/windows-native-cleanup-isolation.test.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-context-trace') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --import ./diagnostic-harness/scripts/windows-startup-trace.mjs --test test/core-agent-observe.test.mjs test/core-agent.test.mjs
            $testCode = $LASTEXITCODE
            Get-ChildItem -Filter 'startup-trace-*.jsonl' | ForEach-Object { Get-Content $_.FullName }
            Get-ChildItem -Filter 'fixture-invocations-*.log' | ForEach-Object { Write-Output ('INVOCATION_FILE=' + $_.Name); Get-Content $_.FullName }
            exit $testCode
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-marker-context') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --import ./diagnostic-harness/scripts/windows-startup-marker-trace.mjs --test test/core-agent-dispatch.test.mjs test/core-agent-initial-prompt.test.mjs test/core-agent-launch-state.test.mjs test/core-agent-observe.test.mjs test/core-agent.test.mjs
            $testCode = $LASTEXITCODE
            Get-ChildItem -Filter 'startup-trace-*.jsonl' | ForEach-Object { Get-Content $_.FullName }
            Get-ChildItem -Filter 'fixture-invocations-*.log' | ForEach-Object { Write-Output ('INVOCATION_FILE=' + $_.Name); Get-Content $_.FullName }
            exit $testCode
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-capture-missing') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --import ./diagnostic-harness/scripts/windows-startup-capture-missing.mjs --test test/agent-send-serial.test.mjs test/core-tmux.test.mjs test/core-agent-observe.test.mjs test/core-agent.test.mjs
            $testCode = $LASTEXITCODE
            Get-ChildItem -Filter 'startup-trace-*.jsonl' | ForEach-Object { Get-Content $_.FullName }
            Get-ChildItem -Filter 'fixture-invocations-*.log' | ForEach-Object { Write-Output ('INVOCATION_FILE=' + $_.Name); Get-Content $_.FullName }
            exit $testCode
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-composer-gate') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test --test-name-pattern='^(agent composer |sendAgentMessage: .*Codex)' test/agent-composer-payload.test.mjs test/core-agent-initial-prompt.test.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-stdin-probe') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test diagnostic-harness/scripts/windows-stdin-integrity-probe.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-transport-probe') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-argv-transport-probe.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-native-init-boundary') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-shell-boundary-probe.mjs --native-pre-bash-only
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-pre-bash-boundary') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-shell-boundary-probe.mjs --pre-bash-only
          } elseif ('${{ inputs.environment }}' -eq 'windows-startup-profile-boundary') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-shell-boundary-probe.mjs --profile-only
          } elseif ('${{ inputs.environment }}' -like 'windows-startup-*') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs diagnostic-harness/scripts/windows-agent-startup-probe.mjs '${{ inputs.environment }}'
          } elseif ('${{ inputs.environment }}' -eq 'windows-registry-probe') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node diagnostic-harness/scripts/windows-registry-query-probe.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-payload-gate') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test --test-name-pattern='Windows PowerShellの公開64KiB' test/tmux-runtime.test.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-portable-gate') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test --test-name-pattern='^portable fork: Codex TUI' test/core-agent-initial-prompt.test.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-observation-gate') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test --test-name-pattern='^(openAgent codex agent_done: (model \u3068 effort|quoted top|.*CODEX_HOME.*root transcript)|target contract: nested launcher)' test/core-agent-observe.test.mjs test/core-agent.test.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-readiness-gate') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/agent-send-readiness.test.mjs test/agent-screen-observation.test.mjs test/agent-send-serial.test.mjs test/agent-preface.test.mjs test/claude-rate-limit-menu.test.mjs test/core-agent-dispatch.test.mjs test/core-agent-initial-prompt.test.mjs test/execution-send-contention.test.mjs test/execution-native-admission.test.mjs test/codex-running-by-record.test.mjs test/settled-turn-ready.test.mjs test/grok-unaccepted-prompt.test.mjs test/grok-rate-limit.test.mjs test/fast-mode.test.mjs test/cursor-agent.test.mjs test/release-metadata.test.mjs test/repository-contract.test.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-participant-gate') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/execution-participant.test.mjs test/execution-native-server.test.mjs test/execution-launch-create-contention.test.mjs test/execution-immediate-stop.test.mjs test/execution-native-admission.test.mjs test/execution-parent-manager.test.mjs test/execution-parent-worker.test.mjs test/release-metadata.test.mjs test/repository-contract.test.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-shell-gate') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/tmux-runtime.test.mjs test/agent-composer-payload.test.mjs test/agent-launch-line.test.mjs test/core-agent.test.mjs test/windows-shell-submission.test.mjs test/core-tmux.test.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-launch-gate') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/agent-launch-line.test.mjs test/tmux-runtime.test.mjs test/agent-composer-payload.test.mjs test/core-pure.test.mjs test/cursor-agent.test.mjs test/agent-send-serial.test.mjs test/core-agent-initial-prompt.test.mjs test/core-agent-dispatch.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test --test-name-pattern='^(openAgent codex agent_done: (model |quoted top|.*CODEX_HOME.*root transcript)|target contract: (Codexは通常CODEX_HOME|Claudeは通常3 scope|nested launcher|Grokは通常HOME)|readAgentTranscript: Claudeはprivate transcript)' test/core-agent-observe.test.mjs test/core-agent.test.mjs
          } elseif ('${{ inputs.environment }}' -eq 'windows-argv-gate') {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --import ./test/seat-env.mjs --test --test-name-pattern='^(openAgent codex agent_done: (model |quoted top)|target contract: (Codexは通常CODEX_HOME|Claudeは通常3 scope)|readAgentTranscript: Claudeはprivate transcript)' test/core-agent-observe.test.mjs test/core-agent.test.mjs
          } else {
            $env:PRODUCT_CI_TEST_SCOPE = 'all'
            node scripts/run-product-ci-tests.mjs
          }
          exit $LASTEXITCODE

  mac-focused:
    if: inputs.environment == 'mac-focused' || inputs.environment == 'mac-argv-gate' || inputs.environment == 'mac-cleanup-gate' || inputs.environment == 'mac-composer-gate' || inputs.environment == 'mac-observation-gate' || inputs.environment == 'mac-portable-gate' || inputs.environment == 'mac-launch-gate' || inputs.environment == 'mac-shell-gate' || inputs.environment == 'mac-participant-gate' || inputs.environment == 'mac-readiness-gate'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ca2dffee40159ab94c27778daa7a97316bb60de6
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Prepare isolated hosted native fixture backend
        if: inputs.environment == 'mac-argv-gate' || inputs.environment == 'mac-cleanup-gate' || inputs.environment == 'mac-composer-gate' || inputs.environment == 'mac-observation-gate' || inputs.environment == 'mac-portable-gate' || inputs.environment == 'mac-launch-gate' || inputs.environment == 'mac-shell-gate' || inputs.environment == 'mac-participant-gate' || inputs.environment == 'mac-readiness-gate'
        run: brew list tmux >/dev/null 2>&1 || brew install tmux
      - name: Verify source and fixed lock
        run: |
          test "$(git rev-parse HEAD)" = ca2dffee40159ab94c27778daa7a97316bb60de6
          test -z "$(git status --porcelain)"
          npm run ci:dependencies
      - name: Preflight and platform runtime gates
        run: |
          for key in core.hooksPath init.templateDir; do
            if git config --system --get "$key" >/dev/null; then
              echo "git system $key: set"
            else
              code=$?
              test "$code" = 1
              echo "git system $key: unset"
            fi
          done
          npm run build
          node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
          if [ '${{ inputs.environment }}' = mac-argv-gate ]; then
            node --import ./test/seat-env.mjs --test --test-name-pattern='^(openAgent codex agent_done: (model |quoted top)|target contract: (Codexは通常CODEX_HOME|Claudeは通常3 scope)|readAgentTranscript: Claudeはprivate transcript)' test/core-agent-observe.test.mjs test/core-agent.test.mjs
          elif [ '${{ inputs.environment }}' = mac-readiness-gate ]; then
            node --import ./test/seat-env.mjs --test test/agent-send-readiness.test.mjs test/agent-screen-observation.test.mjs test/agent-send-serial.test.mjs test/agent-preface.test.mjs test/claude-rate-limit-menu.test.mjs test/core-agent-dispatch.test.mjs test/core-agent-initial-prompt.test.mjs test/execution-send-contention.test.mjs test/execution-native-admission.test.mjs test/codex-running-by-record.test.mjs test/settled-turn-ready.test.mjs test/grok-unaccepted-prompt.test.mjs test/grok-rate-limit.test.mjs test/fast-mode.test.mjs test/cursor-agent.test.mjs test/release-metadata.test.mjs test/repository-contract.test.mjs
          elif [ '${{ inputs.environment }}' = mac-participant-gate ]; then
            node --import ./test/seat-env.mjs --test test/execution-participant.test.mjs test/execution-native-server.test.mjs test/execution-launch-create-contention.test.mjs test/execution-immediate-stop.test.mjs test/execution-native-admission.test.mjs test/execution-parent-manager.test.mjs test/execution-parent-worker.test.mjs test/release-metadata.test.mjs test/repository-contract.test.mjs
          elif [ '${{ inputs.environment }}' = mac-shell-gate ]; then
            node --import ./test/seat-env.mjs --test test/tmux-runtime.test.mjs test/agent-composer-payload.test.mjs test/agent-launch-line.test.mjs test/core-agent.test.mjs test/windows-shell-submission.test.mjs test/core-tmux.test.mjs
          elif [ '${{ inputs.environment }}' = mac-launch-gate ]; then
            node --import ./test/seat-env.mjs --test test/agent-launch-line.test.mjs test/tmux-runtime.test.mjs test/agent-composer-payload.test.mjs test/core-pure.test.mjs test/cursor-agent.test.mjs test/agent-send-serial.test.mjs test/core-agent-initial-prompt.test.mjs test/core-agent-dispatch.test.mjs
            node --import ./test/seat-env.mjs --test --test-name-pattern='^(openAgent codex agent_done: (model |quoted top|.*CODEX_HOME.*root transcript)|target contract: (Codexは通常CODEX_HOME|Claudeは通常3 scope|nested launcher|Grokは通常HOME)|readAgentTranscript: Claudeはprivate transcript)' test/core-agent-observe.test.mjs test/core-agent.test.mjs
          elif [ '${{ inputs.environment }}' = mac-portable-gate ]; then
            node --import ./test/seat-env.mjs --test --test-name-pattern='^portable fork: Codex TUI' test/core-agent-initial-prompt.test.mjs
          elif [ '${{ inputs.environment }}' = mac-observation-gate ]; then
            node --import ./test/seat-env.mjs --test --test-name-pattern='^(openAgent codex agent_done: (model \u3068 effort|quoted top|.*CODEX_HOME.*root transcript)|target contract: nested launcher)' test/core-agent-observe.test.mjs test/core-agent.test.mjs
          elif [ '${{ inputs.environment }}' = mac-composer-gate ]; then
            node --import ./test/seat-env.mjs --test --test-name-pattern='^(agent composer |sendAgentMessage: .*Codex)' test/agent-composer-payload.test.mjs test/core-agent-initial-prompt.test.mjs
          elif [ '${{ inputs.environment }}' = mac-cleanup-gate ]; then
            node --import ./test/seat-env.mjs --test test/execution-launch-create-contention.test.mjs test/windows-native-cleanup-isolation.test.mjs
          else
            node --import ./test/seat-env.mjs --test test/tmux-runtime.test.mjs test/repository-contract.test.mjs
          fi
