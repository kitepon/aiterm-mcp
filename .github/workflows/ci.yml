name: Fixed delivery without tracking lock gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-delivery-unlocked:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: efc5ba95f85f7864fba074c772206e1285228892
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Verify exact source and dependency lock
        run: |
          test "$(git rev-parse HEAD)" = efc5ba95f85f7864fba074c772206e1285228892
          test -z "$(git status --porcelain)"
          npm run ci:dependencies
      - name: Isolated fixture terminal backend
        run: brew list tmux >/dev/null 2>&1 || brew install tmux
      - name: Preflight and delivery/stop removal cases only
        run: |
          for key in core.hooksPath init.templateDir; do
            if git config --system --get "$key" >/dev/null; then
              echo "git system $key: set"
            else
              code=$?
              test "$code" = 1
              echo "git system $key: unset"
            fi
          done
          npm run build
          node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
          node --import ./test/seat-env.mjs --test test/delivery-without-execution-lock.test.mjs test/execution-native-setup.test.mjs
