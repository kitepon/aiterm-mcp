name: Fixed dispatch observation candidate gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-dispatch:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 7050b95989e87015391cc94104ab1c949b9deb38
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Verify exact source and dependency lock
        run: |
          test "$(git rev-parse HEAD)" = 7050b95989e87015391cc94104ab1c949b9deb38
          test -z "$(git status --porcelain)"
          npm run ci:dependencies
      - name: Preflight and new dispatch cases only
        run: |
          for key in core.hooksPath init.templateDir; do
            if git config --system --get "$key" >/dev/null; then
              echo "git system $key: set"
            else
              code=$?
              test "$code" = 1
              echo "git system $key: unset"
            fi
          done
          npm run build
          node --import ./test/seat-env.mjs --test test/seat-env.test.mjs
          node --import ./test/seat-env.mjs --test test/execution-dispatch-admission.test.mjs
