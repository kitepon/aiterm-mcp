name: Product full CI

on:
  workflow_call:
    inputs:
      full-command:
        description: 各環境で実行する製品の最終試験
        required: true
        type: string
      dependency-command:
        description: 各環境で実行する依存導入
        required: false
        default: ""
        type: string
      documentation-command:
        description: Markdownだけの変更時にLinux 1環境で実行する文書確認
        required: true
        type: string
      environment:
        description: all または単一の対応環境
        required: false
        default: all
        type: string
      test-files:
        description: Optional explicit test file selection
        required: false
        default: ""
        type: string
      comparison_base:
        description: workflow_dispatchで使う明示的な比較元commit/ref
        required: false
        default: ""
        type: string

permissions:
  # classifyが、同じcommitの全テストの成功を読む（scripts/product-ci-plan.mjs）。
  actions: read
  contents: read

jobs:
  classify:
    runs-on: [self-hosted, factory, linux-workstation]
    timeout-minutes: 5
    outputs:
      product_change: ${{ steps.changes.outputs.product_change }}
      comparison_base: ${{ steps.changes.outputs.comparison_base }}
      environments: ${{ steps.changes.outputs.environments }}
      test_scope: ${{ steps.changes.outputs.test_scope }}
      test_files: ${{ steps.changes.outputs.test_files }}
      prior_full: ${{ steps.changes.outputs.prior_full }}
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: classify change
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISPATCH_TEST_FILES: ${{ inputs.test-files }}
          DISPATCH_BASE: ${{ inputs.comparison_base }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/product-ci-plan.mjs plan
      - name: documentation dependency install
        if: steps.changes.outputs.product_change == 'false' && inputs.dependency-command != ''
        shell: bash
        run: ${{ inputs.dependency-command }}
      - name: documentation check
        if: steps.changes.outputs.product_change == 'false'
        shell: bash
        run: ${{ inputs.documentation-command }}
      - name: skip product full CI
        if: steps.changes.outputs.product_change == 'false'
        shell: bash
        run: |
          printf 'Markdown-only change: product full CI is not required.\n'

  full:
    needs: classify
    # 選んだ環境が全部、同じcommitの全テストでもう通っている時は、環境が空になる。空のmatrixは起こさない。
    if: needs.classify.outputs.product_change == 'true' && needs.classify.outputs.environments != '[]'
    name: ${{ needs.classify.outputs.test_scope == 'all' && 'full' || 'selected' }} (${{ matrix.environment }})
    env:
      PRODUCT_CI_TEST_SCOPE: ${{ needs.classify.outputs.test_scope }}
      PRODUCT_CI_TEST_FILES: ${{ needs.classify.outputs.test_files }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.classify.outputs.environments) }}
    timeout-minutes: 30
    # macos-hosted is a GitHub-hosted VM (free for this public repository); the Owner's Mac carries production seats.
    runs-on: ${{ matrix.environment == 'macos-hosted' && 'macos-latest' || fromJSON(format('["self-hosted","factory","{0}"]', matrix.environment)) }}
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: macOS Node
        if: matrix.environment == 'macos-hosted'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: macOS tmux
        if: matrix.environment == 'macos-hosted'
        shell: bash
        run: command -v tmux >/dev/null || brew install tmux
      - name: logical CPU parallelism
        if: matrix.environment != 'windows-native'
        shell: bash
        run: |
          jobs=$(node -p "require('node:os').availableParallelism()")
          printf 'FACTORY_CI_JOBS=%s\n' "$jobs" >> "$GITHUB_ENV"
      - name: logical CPU parallelism
        if: matrix.environment == 'windows-native'
        shell: pwsh
        run: |
          $jobs = node -p "require('node:os').availableParallelism()"
          "FACTORY_CI_JOBS=$jobs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: dependency install
        if: inputs.dependency-command != '' && matrix.environment != 'windows-native'
        shell: bash
        run: ${{ inputs.dependency-command }}
      - name: dependency install
        if: inputs.dependency-command != '' && matrix.environment == 'windows-native'
        shell: pwsh
        run: ${{ inputs.dependency-command }}
      - name: product full test
        if: matrix.environment != 'windows-native'
        shell: bash
        run: ${{ inputs.full-command }}
      - name: product full test
        if: matrix.environment == 'windows-native'
        shell: pwsh
        run: ${{ inputs.full-command }}
      - name: preserve Windows PTY failure evidence
        if: failure() && matrix.environment == 'windows-native'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pty-failures-${{ matrix.environment }}-${{ github.sha }}-${{ github.run_attempt }}
          path: test-failure-snapshots/
          if-no-files-found: ignore
          retention-days: 7

  gate:
    needs: [classify, full]
    if: always()
    runs-on: [self-hosted, factory, linux-workstation]
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: verify selected CI results
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FULL_RESULT: ${{ needs.full.result }}
          PRODUCT_CHANGE: ${{ needs.classify.outputs.product_change }}
          ENVIRONMENTS: ${{ needs.classify.outputs.environments }}
          PRIOR_FULL: ${{ needs.classify.outputs.prior_full }}
        run: node scripts/product-ci-plan.mjs verify
