name: Publish to MCP Registry

# Registers server.json with the Official MCP Registry
# (registry.modelcontextprotocol.io), which auto-propagates to PulseMCP and the
# GitHub MCP Registry. Auth is GitHub OIDC — no secrets needed. Keep
# server.json's version in lockstep with the published npm version before
# triggering (npm package aiterm-mcp@<version> must already exist).
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC for the io.github.kitepon/* namespace
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$version"
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      # C10: Release 発行は tag も生むため、tag 起点の ci.yml(npm publish) と本 workflow(release 起点)が
      # 並走し得る。mcp-publisher は server.json が参照する npm version の存在を要求するため、npm publish
      # 完了前に走ると「duplicate でない」失敗で赤くなる。npm に該当 version が現れるまで待ってから登録する。
      - name: Wait for the npm package version to be published
        run: |
          ver=$(node -p "require('./package.json').version")
          echo "Waiting for aiterm-mcp@$ver on npm (max 10 min)..."
          for i in $(seq 1 30); do
            if npm view "aiterm-mcp@$ver" version >/dev/null 2>&1; then
              echo "aiterm-mcp@$ver is available."
              exit 0
            fi
            echo "  not yet (attempt $i/30) — sleeping 20s"
            sleep 20
          done
          echo "::error::aiterm-mcp@$ver が npm に現れませんでした（10分）。npm publish の完了を確認してください。"
          exit 1
      - name: Authenticate to the Official MCP Registry (GitHub OIDC)
        # Registry の JWT は短命（v0.45.0 で npm 待ちの約5分の間に失効し 401）。待ちの後、publish 直前に取る。
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: |
          # 同一 version の再 publish はレジストリが HTTP 400
          # "invalid version: cannot publish duplicate version" を返す。これは
          # 既にそのバージョンが登録済みのときに本ワークフローが再発火した場合
          # （例: tag フローで publish 済みの版に対し release 再実行が走る）に起き、
          # レジストリ側は既に最新＝無害。この特定ケースのみ握って成功扱いにし、
          # それ以外の失敗はすべて表面化させる（黙ったフォールバックを避ける）。
          set +e
          out=$(./mcp-publisher publish 2>&1); rc=$?
          echo "$out"
          if [ $rc -ne 0 ]; then
            if echo "$out" | grep -q "duplicate version"; then
              echo "::notice::server.json のこのバージョンは既にレジストリ登録済み — 重複を成功として扱う（idempotent）。"
              exit 0
            fi
            exit $rc
          fi
