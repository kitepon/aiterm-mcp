name: terminal runtime

# Builds the provisioned terminal runtime for a published release and attaches it to that release
# (docs/architecture/remote-terminal.md R16/R17). `aiterm-remote-terminal provision` installs these assets.
# macOS, Linux and Windows build in parallel; one publish job attaches the four tarballs, the Windows zip and the one SHA256SUMS over them.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Released version (x.y.z) whose runtime assets are missing
        type: string
        required: true

permissions:
  contents: write

env:
  VERSION_INPUT: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', inputs.version) }}

jobs:
  build:
    # GitHub-hosted (free for this public repository): never build on the Owner's Mac.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin
            runner: macos-latest
            script: build-macos-runtime.mjs
          - platform: linux
            runner: ubuntu-latest
            script: build-linux-runtime.mjs
          - platform: windows
            runner: windows-latest
            script: build-windows-runtime.mjs
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        # The runtime is built from the npm package; the checkout only supplies the build scripts. A manual run takes
        # them from the dispatched ref, so a build-script fix can supply a released version's missing assets.
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - name: resolve version
        shell: bash
        run: |
          version="${VERSION_INPUT#v}"
          if [ "$GITHUB_EVENT_NAME" = release ]; then test "$version" = "$(node -p "require('./package.json').version")"; fi
          printf 'RUNTIME_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: wait for the npm package
        shell: bash
        run: |
          # The version can be listed before its tarball is served (0.70.19: build 404 at 22 s); wait for the tarball itself.
          for i in $(seq 1 45); do
            url=$(npm view "aiterm-mcp@$RUNTIME_VERSION" dist.tarball 2>/dev/null) && [ -n "$url" ] && curl -fsI -o /dev/null "$url" && exit 0
            sleep 20
          done
          echo "::error::aiterm-mcp@$RUNTIME_VERSION did not appear on npm within 15 minutes"
          exit 1
      - name: zig for the static Linux tmux
        if: matrix.platform == 'linux'
        shell: bash
        # The Linux builder cross-compiles tmux for both architectures with `zig cc` (same toolchain as build-write-ban.mjs).
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet ziglang==0.15.2
          echo "ZIGLANG_PYTHON=$RUNNER_TEMP/zig/bin/python" >> "$GITHUB_ENV"
      - name: build both architectures and smoke the host one
        shell: bash
        # The macOS runner account's login shell is /usr/bin/false; tmux runs a one-string window command through $SHELL.
        # A runner without TMPDIR would share /tmp/claude-tmux-sockets with other users of the machine.
        env:
          SHELL: /bin/sh
          BUILD_SCRIPT: ${{ matrix.script }}
        run: |
          export TMPDIR="$RUNNER_TEMP"
          out="$RUNNER_TEMP/aiterm-runtime"
          rm -rf "$out"
          node "scripts/$BUILD_SCRIPT" "$RUNTIME_VERSION" "$out"
      - name: keep the tarballs and the zip for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/aiterm-runtime/*.tar.gz
            ${{ runner.temp }}/aiterm-runtime/*.zip
          if-no-files-found: error
          retention-days: 1
      - name: clean
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/aiterm-runtime"

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - name: collect the tarballs and the zip
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: runtime-*
          merge-multiple: true
          path: ${{ runner.temp }}/aiterm-runtime
      - name: attach to the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/upload-runtime-assets.mjs "${VERSION_INPUT#v}" "$RUNNER_TEMP/aiterm-runtime"
