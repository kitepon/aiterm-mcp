name: Windows input boundary diagnostic
on:
  push:
    branches: [diag/windows-input-boundary-20261101]
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    uses: ./.github/workflows/product-full-ci.yml
    with:
      environment: windows-native
      comparison_base: 83a6a68e25b196a1bdefe8bd6ddd43ee1a928904
      dependency-command: npm run ci:dependencies
      documentation-command: npm run test:docs
      full-command: >-
        node --version && npm --version && npm run build &&
        node --import ./test/seat-env.mjs --test test/seat-env.test.mjs &&
        node scripts/windows-input-boundary-diagnostic.mjs . diagnostic-evidence load-parent
