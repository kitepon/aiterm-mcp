name: Windows input boundary diagnostic
on:
  push:
    branches: [diag/windows-input-boundary-20261101]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: [self-hosted, factory, windows-native]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: install dependencies
        shell: pwsh
        run: npm run ci:dependencies
      - name: trace isolated native input and execution
        shell: pwsh
        run: >-
          node --version && npm --version && npm run build &&
          node --import ./test/seat-env.mjs --test test/seat-env.test.mjs &&
          node scripts/windows-input-boundary-diagnostic.mjs . diagnostic-evidence load-parent
